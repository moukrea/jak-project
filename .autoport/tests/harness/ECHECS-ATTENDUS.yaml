# ECHECS-ATTENDUS.yaml — les echecs que la suite du harnais porte SCIEMMENT.
#
# Un test inscrit ici n'est ni desactive, ni `xfail`, ni saute : il TOURNE, il ECHOUE, et sa
# survie a une raison ECRITE et un NOM. C'est la seule facon de rendre la suite lisible sans
# mentir sur ce qu'elle dit.
#
# CE FICHIER NE PEUT PAS SERVIR A SE DONNER DU VERT. `lib/census/harness-test-suite-is-not-a-signal.sh`
# compte comme DEFAUT, et publie separement :
#   - tout echec ABSENT d'ici                                   -> un vrai regressif
#   - toute entree d'ici qui NE ROUGIT PLUS                     -> dispense perimee
#   - toute entree qui rougit pour une AUTRE raison que sa `signature`  -> defaut cache sous une dispense
# Il est versionne, la preuve publie son empreinte, et chaque entree nomme QUI doit trancher.
#
# `signature` est une EXPRESSION REGULIERE cherchee dans le message d'echec. Assez precise pour
# qu'un autre defaut ne passe pas dessous, assez large pour ne pas rougir sur le nom de l'item
# qui trebuche en premier.

attendus: []
