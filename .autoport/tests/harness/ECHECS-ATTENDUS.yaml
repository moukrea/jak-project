# ECHECS-ATTENDUS.yaml — les echecs que la suite du harnais porte SCIEMMENT.
#
# Un test inscrit ici n'est ni desactive, ni `xfail`, ni saute : il TOURNE, il ECHOUE, et sa
# survie a une raison ECRITE et un NOM. C'est la seule facon de rendre la suite lisible sans
# mentir sur ce qu'elle dit.
#
# CE FICHIER NE PEUT PAS SERVIR A SE DONNER DU VERT. `lib/census/harness-test-suite-is-not-a-signal.sh`
# compte comme DEFAUT, et publie separement :
#   - tout echec ABSENT d'ici                                   -> un vrai regressif
#   - toute entree d'ici qui NE ROUGIT PLUS                     -> dispense perimee
#   - toute entree qui rougit pour une AUTRE raison que sa `signature`  -> defaut cache sous une dispense
# Il est versionne, la preuve publie son empreinte, et chaque entree nomme QUI doit trancher.
#
# `signature` est une EXPRESSION REGULIERE cherchee dans le message d'echec. Assez precise pour
# qu'un autre defaut ne passe pas dessous, assez large pour ne pas rougir sur le nom de l'item
# qui trebuche en premier.

attendus:

  - nodeid: .autoport/tests/harness/test_backlog.py::test_real_backlog_only_fails_lint_on_missing_gates
    slug: lint-budget-sans-raison-ecrite
    categorie: decision-owner
    tranche: owner
    signature: 'au-dessus du defaut [0-9]+ sans raison'
    depuis: 5b3cee5f64
    raison: >
      Le lint reproche a TROIS items de porter un budget au-dessus du defaut sans la raison
      litterale « budget : » dans leurs notes : cutscene-npc-flicker (max_retries 8),
      anim-interp-low-fps (max_retries 8) et lighting-hdr (max_turns 1000). Les trois budgets
      ont ete rendus par l'OWNER lui-meme : 5b3cee5f64 du 2026-09-06T08:27 pour les deux
      premiers (« leur budget d'essais est rendu (8) »), et lighting-hdr portait la note
      « budget : touche les six shaders monde... » jusqu'a 70909297ed du 2026-09-06T23:19, ou
      l'owner l'a remplacee par une justification plus longue qui ne porte plus le marqueur
      litteral. Aucun code n'ecrit max_turns ni max_retries dans le backlog : le compte de
      notes « budget : » dans le fichier n'a fait que MONTER (14 -> 15 -> 18 -> 19 entre le
      11 et le 12/09), rien ne les efface. Ce n'est donc pas un defaut de code : c'est une
      phrase que seul l'owner peut ecrire, et le perimetre de cet item lui interdit
      expressement de l'ecrire a sa place.
    ce_que_l_owner_doit_trancher: >
      Soit ecrire « budget : <pourquoi> » dans les notes des trois items, soit ramener leurs
      budgets au defaut (800 tours / 6 essais), soit dire que le marqueur litteral n'est plus
      la bonne regle. Les trois sortent ce test du rouge.

  - nodeid: .autoport/tests/harness/test_backlog.py::test_the_real_backlog_carries_sane_budgets
    slug: budget-au-dessus-du-defaut-sans-note
    categorie: decision-owner
    tranche: owner
    signature: 'assert [0-9]+ <= [0-9]+'
    depuis: 5b3cee5f64
    raison: >
      MEME CAUSE, autre angle : ce test parcourt les items et exige qu'un budget au-dessus du
      defaut soit accompagne de la note « budget : ». Il trebuche sur le premier des trois,
      cutscene-npc-flicker (max_retries 8 > 6). Corriger l'un sans l'autre ne ferait que
      deplacer le nom dans le message. Voir l'entree ci-dessus : c'est le meme geste d'owner
      qui eteint les deux.
    ce_que_l_owner_doit_trancher: idem que l'entree ci-dessus.

# ---------------------------------------------------------------------------------------------
# LE TRI DES ECHECS SIGNALES LE 12/09 (reports/harness-commit-paths-all-or-nothing/FINDINGS.txt).
# Trois classes, comme le livrable les nomme. Chaque ligne porte la CAUSE mesuree, pas devinee.
triage:

  - nodeid: .autoport/tests/harness/test_cli_backend.py::test_cli_options_are_isolated_and_toml_valid
    classe: test-devenu-faux
    slug: model-absent-decrete
    cause_commit: 50e9dc5af6
    cause: >
      Le test exigeait l'ABSENCE de `--model` dans la ligne de commande Codex. Le code et
      l'assertion sont nes ENSEMBLE au commit 61123c4a71 (2026-09-07T12:02), coherents tant
      que `manager_model` valait "". L'owner a fixe Astra dans
      .autoport/codex/profiles.json au commit 50e9dc5af6 (2026-09-07T18:02) : une DONNEE
      livree a rougi une assertion de code. Le test mesurait le fichier de configuration du
      jour, pas un invariant.
    correctif: >
      Le test mesure desormais l'invariant dans les deux regimes, sur des profils injectes :
      profil sans modele -> pas de `--model` ; profil qui en nomme un -> `--model <celui-la>`,
      une seule fois. Strictement plus large que l'assertion d'avant.

  - nodeid: .autoport/tests/harness/test_cli_backend.py::test_supervisor_resume_targets_exact_codex_thread
    classe: test-devenu-faux
    slug: model-absent-decrete-superviseur
    cause_commit: 50e9dc5af6
    cause: MEME cause et MEME commit que l'entree ci-dessus, sur le `--check` du superviseur Codex.
    correctif: l'assertion lit le profil actif au lieu de decreter l'absence.

  - nodeid: .autoport/tests/harness/test_cli_backend.py::test_codex_success_still_waits_for_owner
    classe: test-devenu-faux
    slug: faux-close-gate-signature-perimee
    cause_commit: ff60991381
    cause: >
      Le faux `close_gate` du test prenait UN argument. La vraie fonction en recoit DEUX
      depuis ff60991381 (2026-09-12), quand GATE 0 a appris a lire la ligne de base de
      l'arbre. Le test mourait en TypeError DANS l'orchestrateur, sur un message qui
      n'accusait pas le faux. Cet echec est apparu APRES le signalement : il explique
      pourquoi test_cli_backend en compte trois aujourd'hui et deux le 12/09 au matin.
    correctif: >
      Le faux porte la signature reelle et VERIFIE qu'on lui passe la ligne de base. S'il
      derive de nouveau, c'est le test qui rougit, avec le bon nom.

  - nodeid: .autoport/tests/harness/test_proof_busy.py::test_prompt_mentionnant_compilateur_ne_bloque_pas
    classe: defaut-de-code
    slug: verdict-dependant-des-processus-reels
    cause_commit: ''
    cause: >
      Le test lisait les processus REELS de la machine : il rougissait des qu'un vrai `ninja`
      ou `clang++` tournait au meme moment, donc pendant tout cycle de construction arm64.
      Faux rouge aleatoire, sans rapport avec le code juge.
    correctif: >
      `busy_reason` ne parle plus au systeme : elle passe par `busy_procs`, que le banc
      remplace par une liste INJECTEE. Ce qui reste lu sur les vrais processus, c'est
      `busy_procs` seule, et seulement sur des noms sentinelles qu'aucun constructeur ne
      porte. Le verdict ne peut plus dependre de ce que la machine fait a cote.

  - nodeid: .autoport/tests/harness/test_backlog.py::test_real_backlog_only_fails_lint_on_missing_gates
    classe: decision-owner
    slug: lint-budget-sans-raison-ecrite
    cause_commit: 5b3cee5f64
    cause: voir la section `attendus`.
    correctif: "aucun. Le perimetre interdit d'ecrire une raison « budget : » a la place de l'owner."

  - nodeid: .autoport/tests/harness/test_backlog.py::test_the_real_backlog_carries_sane_budgets
    classe: decision-owner
    slug: budget-au-dessus-du-defaut-sans-note
    cause_commit: 5b3cee5f64
    cause: voir la section `attendus`.
    correctif: aucun, meme raison.

