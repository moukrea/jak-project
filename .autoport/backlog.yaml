  known_cause: 'Cinq refus de l''owner sur hdr-display-output, cinq corrections a l''aveugle, et la meme
    plainte a chaque fois : aucun gain dans les ombres, un effet qui se resume a « les endroits brillants
    brillent plus ». Owner 11/09 : « je me demande si l''espace couleur dans lequel on calcule le HDR
    est assez riche pour commencer... avant la prochaine iteration faut vraiment creuser le sujet en profondeur
    ». Il a raison : chaque tour a regle une courbe sans jamais etablir CE QUI ENTRE dans cette courbe.
    Et le code avoue deja une partie du probleme — le gain dans les ombres publie compare des nombres
    de paliers de quantification, pas de la luminance.'
  deliverable: 'Un document, pas une correction : `reports/hdr-study/ETUDE.md`. AUCUN changement de rendu.
    Il repond, mesure a l''appui, a six questions — chacune avec le chiffre releve sur l''appareil et
    le site de code qui le produit. (1) LA CHAINE COMPLETE, du calcul d''eclairage au pixel envoye a la
    dalle : chaque etape nommee, son format et sa precision (nombre de bits, virgule flottante ou entier,
    espace lineaire ou encode). Ou la scene perd-elle sa plage ? (2) LE TAMPON DE CALCUL est-il assez
    riche ? Publier sa profondeur reelle et la plage de valeurs qu''il contient sur du jeu reel — combien
    de scenes depassent 1,0, et de combien. (3) LES OMBRES : quelle est la plus petite difference de luminance
    distinguable, en nits livres, en SDR puis en HDR, sur les memes images ? Si le HDR n''en gagne pas,
    DIRE POURQUOI. (4) LA COURBE VARIE-T-ELLE VRAIMENT dans le temps sur un parcours reel, et de combien
    ? L''owner ne l''a pas vu — mesurer si c''est imperceptible ou inexistant. (5) LE FORMAT : ce que
    chaque transport (scRGB, HDR10, HLG) change reellement a l''image sur cet appareil, et pourquoi un
    seul est utilisable. (6) CE QUI EMPECHE le gain attendu : la liste des causes, classees par ce qu''elles
    coutent a corriger. Le document se termine par une RECOMMANDATION : ce qu''il faut changer, dans quel
    ordre, et ce qui est hors de portee sur ce materiel.'
  where: 'rien a voir : c''est une etude, elle ne change pas le rendu ; owner_test=false'
