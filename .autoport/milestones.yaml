    arg-shuffle gap in kscheme.cpp::call_goal. A21 is DIAGNOSTIC ONLY — add env-gated trace patches in linux_arm64_main.cpp,
    klink.cpp, Allocator_v2.cpp, kscheme.cpp; discriminate which hypothesis holds; honest-exit with bug-class-identified.md
