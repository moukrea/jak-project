    goalc file.'
  prompt: prompts/phase-A7-emitter-unit-tests.md
  validator: validators/phase-A7-emitter-unit-tests.sh
  max_turns: 600
  max_retries: 15
- id: A8-qemu-repro-and-displaygc-fix
  name: qemu-aarch64-static reproduction of display.gc NULL fn-ptr BLR + the actual fix. Extend linux-arm64 driver to load ENGINE/GAME.CGO; per-BLR
    trace; identify root-cause; fix in IGenARM64.cpp / ObjectGenerator.cpp / klink.cpp / kscheme.cpp as appropriate. D4 device validator must
    pass end-to-end (hardened SDL/GL marker requirements). No fault-recovery dodges.
  prompt: prompts/phase-A8-qemu-repro-and-displaygc-fix.md
  validator: validators/phase-A8-qemu-repro-and-displaygc-fix.sh
  max_turns: 800
  max_retries: 20
- id: A9-codegen-spill-ops
  name: 'Narrow unlock of goalc/compiler/CodeGenerator.cpp::do_goal_function_arm64 to implement real spill ops (LDR/STR Xt, [SP, #imm12]) + frame
    setup (SUB/ADD SP, SP, #frame). Replaces NOP placeholders that caused the display.gc NULL fn-ptr BLR. D4 device validator must pass end-to-end.'
  prompt: prompts/phase-A9-codegen-spill-ops.md
  validator: validators/phase-A9-codegen-spill-ops.sh
  max_turns: 600
  max_retries: 15
- id: A10-callee-save-area
  name: Caller-save-area preservation across GOAL→GOAL BLR. Identify and fix the IR_* op (most likely vector/128-bit store or stack-var-offset
    miscomputation) that corrupts the caller's preserved-register area. Narrow IR.cpp unlock. D4 device-validator must pass end-to-end.
  prompt: prompts/phase-A10-callee-save-area.md
  validator: validators/phase-A10-callee-save-area.sh
  max_turns: 600
  max_retries: 15
- id: A11-texture-sym-binding
  name: Resolve texture-CGO top-level sym=0 SIGILL. Instrument klink + symbol bind to identify the unbound symbol whose slot reads 0 at the
    failing BLR site, then fix the root cause (likely CGO link-order or missing top-level define). Narrow klink.cpp + symbol.cpp diagnostic
    unlock; D4 device-validator must pass end-to-end with ≥3/5 SDL/GL real-init markers.
  prompt: prompts/phase-A11-texture-sym-binding.md
  validator: validators/phase-A11-texture-sym-binding.sh
  max_turns: 600
  max_retries: 12
- id: A12-gsound-stack-fnptr
  name: Resolve gsound stack-loaded fn-ptr=0 SIGILL (the post-A11-FFI-bridge boot ceiling at 156 link-finishes). Extend SIGILL diag with
    backward-provenance stack-store trace to localise which earlier instruction wrote 0 to the slot, then fix the underlying unbound-sym /
    unset-method-slot / uninitialised-struct-field. Same unlock list as A11 (klink/kmachine/symbol/diag handlers); codegen + kscheme + asm
    trampoline stay locked.
  prompt: prompts/phase-A12-gsound-stack-fnptr.md
  validator: validators/phase-A12-gsound-stack-fnptr.sh
  max_turns: 600
  max_retries: 12
- id: A13-iop-kernel-mutex-init
  name: Initialise IOP_Kernel's pthread_mutex_t members on linux-arm64 / android-arm64 (zero-init in BSS by default, so the first
    sif_rpc call from gsound's top-level SEGVs in pthread_mutex_lock). Smallest A13 candidate per A12 next-blocker — mutex pre-init only,
    no IOP thread spawning. Async RPCs queue but don't wait; sync RPCs (A14+) need a real IOP thread.
  prompt: prompts/phase-A13-iop-kernel-mutex-init.md
  validator: validators/phase-A13-iop-kernel-mutex-init.sh
  max_turns: 600
  max_retries: 12
- id: A14-pc-memmove-bind
  name: Bind __mem-move on linux-arm64 / android-arm64 (the next unbound pc-* helper that dma-buffer's top-level invokes after the A13
    IOP unblock). Add a klink_a14_ensure_pc_memmove_bound helper to klink.cpp mirroring the A11/A12 pattern; chain into the pre-version
    -check hook in both boot drivers. Smallest A14 candidate per A13 attempt-3 next-blocker.
  prompt: prompts/phase-A14-pc-memmove-bind.md
  validator: validators/phase-A14-pc-memmove-bind.sh
  max_turns: 400
  max_retries: 8
- id: A15-regalloc-fnptr-livethrough
  name: Add a regalloc constraint so a CALL_R64's function-pointer source register cannot be reused as the destination of any intervening
    IR op between the load and the BLR. Closes the sig=7 SIGBUS at sin*! call sites where the V2 allocator assigned the fn-ptr and an
    SDIV destination to the same physical reg, the SDIV clobbered the fn-ptr, and BLR jumped to ee_base+offset/10 (unaligned PC).
    Unlocks goalc/regalloc/ for the first time since A1.
  prompt: prompts/phase-A15-regalloc-fnptr-livethrough.md
  validator: validators/phase-A15-regalloc-fnptr-livethrough.sh
  max_turns: 600
  max_retries: 12
- id: A16-device-cpu-divergence-diag
  name: Diagnose what the Redmi Note 9 Pro Cortex-A76 CPU rejects that qemu-aarch64-static accepts. Diagnostic-only phase — extend the
    SIGSEGV diag handler to walk back through ADRP/ADD pairs in the lr-window, identify which Xd was clobbered between an ADRP and a
    subsequent LDR/STR. Authored after A15 attempts 1+2 both reverted (qemu +46, device -101 to -113) — two failed fix attempts is
    enough; we need data, not more guesses.
  prompt: prompts/phase-A16-device-cpu-divergence-diag.md
  validator: validators/phase-A16-device-cpu-divergence-diag.sh
  max_turns: 400
  max_retries: 6
- id: A17-idiv-emitter-spill
  name: 'Emitter-side IDIV spill — preserve X8 across SDIV/UDIV in the IDIV emit itself so the regalloc never sees X8 as clobbered.
    Closes the sin call site sig=7 SIGBUS that A14 surfaced and that A15 (regalloc-layer) attempts both failed to fix. Per A16
    diagnostic, x16 is not clobbered; the bug IS the original SDIV-X8 → BLR-X8. Localizing the X8 use to the emit avoids the
    qemu/device allocation-ripple divergence that broke A15.'
  prompt: prompts/phase-A17-idiv-emitter-spill.md
  validator: validators/phase-A17-idiv-emitter-spill.sh
  max_turns: 500
  max_retries: 10
- id: F1-gameplay-geyser-rock
