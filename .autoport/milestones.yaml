    dodge entirely (storage, arming, dispatcher branch, asm short-circuit). Regenerate CGOs; D4 re-passes WITH the GOAL dispatcher actually running.'
  prompt: prompts/phase-A6-emitter-off-register.md
  validator: validators/phase-A6-emitter-off-register.sh
  max_turns: 600
  max_retries: 20
- id: A7-emitter-unit-tests
  name: 'Build emitter unit test harness (Level 0 encoding asserts + Level 1 qemu-aarch64-static exec tests) at .autoport/tests/emitter/. Runtime
