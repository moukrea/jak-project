    SP+32 = 0x07fffe84, math 0x07fffe84+0x2123000000=0x212afffe84). A22 unlocks IGenARM64.{cpp,h} + IR.cpp + asm_funcs_arm64.s
    to find and fix the SOURCE emit sequence that writes stack_addr into a scratch/callee-saved reg. Forbidden cheats: widening
    call_r64 to save all X19..X28 without naming source, trampoline-wrapper masking the bug, NOP padding, removing OG_*_TRACE
    diags. Three valid exits: A) fix landed + qemu boot >=217 + A22-fix-summary.md naming specific emit surface; B) honest
    next-blocker.md naming file outside unlock list; C) no-source-located.md (lowest quality but honest). All require A22-investigation-trace.md
    ≥150 lines.'
  prompt: prompts/phase-A22-arm64-codegen-h2-fix.md
  validator: validators/phase-A22-arm64-codegen-h2-fix.sh
  max_turns: 800
  max_retries: 5
- id: A23-arm64-blr-target-tracer
