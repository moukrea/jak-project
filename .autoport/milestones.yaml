  validator: validators/phase-A18-type-method-zero-bind.sh
  max_turns: 500
  max_retries: 8
- id: A19-goalc-arm64-codegen-fixes
  name: 'Land TWO arm64-specific goalc codegen fixes diagnosed by A18 attempt-4. (1) X12 regalloc clobber: when a GOAL→C arg-shuffle
    stashes a value into X12 that is live across an IR_FunctionCall, the caller-save spill list must include X12 (or the regalloc
    must move the value to AAPCS callee-save X19-X28). Evidence: disasm of dead-pool-heap.get-process shows MOV X12,X7 at
    lr-388 then STP/STR list at lr-292..lr-284 saving {X3,X5,X10,X11,X23} but NOT X12 — find-gap-by-size clobbers X12, X12
    used as this for the next dispatch → SIGILL. (2) Field-offset off-by-4 in arm64 emit: LDR/STR of basic-relative field
    offsets encode (real-4) instead of real. Evidence: find-gap-by-size emits LDR W3,[X16,#0x30] (=48) for (-> this first-gap)
    which is at offset 52 per gkernel-h.gc layout (basic 0 + process-tree 32 + dead-pool +0 + dead-pool-heap[allocated-length,compact-time,
    compact-count-targ,compact-count,fill-percent]=20 → first-gap at 52). x86 boots; cannot be reading 48. Both fixes must
    land together to advance boot past the 216 link-finish ceiling at start-time-of-day. New arm64 CGO baseline required.'
  prompt: prompts/phase-A19-goalc-arm64-codegen-fixes.md
  validator: validators/phase-A19-goalc-arm64-codegen-fixes.sh
  max_turns: 600
  max_retries: 6
- id: A20-goalc-arm64-field-offset
  name: 'Land the arm64-specific field-offset off-by-4 fix in the goalc compiler layer. A19 attempt-1 proved via 8 encoder
    unit tests that IGenARM64.cpp imm12-encoding helpers honour offsets verbatim, so Bug 2 is NOT in the emitter. Most likely
    sites: goalc/compiler/IR.cpp::IR_LoadConstOffset::do_codegen_arm64; goalc/compiler/Val.cpp::MemoryDerefVal::to_reg or
    get_constant_offset_and_base; goalc/compiler/compilation/Type.cpp''s MemoryOffsetConstantVal construction (lines 47, 143,
    707, 717, 856, 874, 901 per A19 attempt-1 next-blocker). Path A: add OG_OFFSET_TRACE env-gated diag in do_codegen_arm64/x86,
    compare m_offset for find-gap-by-size, identify diverging site, one-line fix. Path B: walk MemoryOffsetConstantVal sites
    for arm64-specific branches. A19''s X12 fix stays in HEAD (no IGenARM64 changes in A20). New arm64 CGO baseline.'
  prompt: prompts/phase-A20-goalc-arm64-field-offset.md
  validator: validators/phase-A20-goalc-arm64-field-offset.sh
  max_turns: 600
  max_retries: 6
- id: A21-arm64-codegen-deeper-investigation
  name: 'Diagnostic phase post-A20 off-by-4 falsification. A20 attempt-1 proved via OG_OFFSET_TRACE (196k-line zero-diff trace)
    and KERNEL.CGO byte-scan (15 instances each of LDR Wt,[X16,#48] and [X16,#52] at mod-4=2 alignment) that the field-offset
    off-by-4 hypothesis is wrong. Real 216-link-finish ceiling cause is one of 4 hypotheses per A20-attempt-1-next-blocker.md:
    H1 second regalloc-clobber surface (weak per supervisor check — HEAD already saves R3/R5/R10/R11/R12+X23 in call_r64);
    H2 X16 corruption in IR_FunctionCall::do_codegen_arm64 across BLR; H3 klink-time LDR-literal imm19 NOPs (81 warnings in
    qemu log); H4 AAPCS arg-shuffle gap in kscheme.cpp::call_goal. A21 is DIAGNOSTIC ONLY — add env-gated trace patches in
    linux_arm64_main.cpp, klink.cpp, Allocator_v2.cpp, kscheme.cpp; discriminate which hypothesis holds; honest-exit with
    bug-class-identified.md naming primary hypothesis and recommended A22 narrow-fix scope. In-scope fixes (klink, kscheme
    call_goal, linux_arm64_main) may be landed if evidence is unambiguous. IGenARM64.cpp and IR.cpp stay locked (A19/A20 proved
    no bug there).'
  prompt: prompts/phase-A21-arm64-codegen-deeper-investigation.md
  validator: validators/phase-A21-arm64-codegen-deeper-investigation.sh
  max_turns: 600
  max_retries: 6
- id: A22-arm64-codegen-h2-fix
