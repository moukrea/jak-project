  validator: validators/phase-A16-device-cpu-divergence-diag.sh
  max_turns: 400
  max_retries: 6
- id: A17-idiv-emitter-spill
  name: Emitter-side IDIV spill — preserve X8 across SDIV/UDIV in the IDIV emit itself so the regalloc never sees X8 as clobbered.
