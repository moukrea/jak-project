    A16 diagnostic, x16 is not clobbered; the bug IS the original SDIV-X8 → BLR-X8. Localizing the X8 use to the emit avoids
    the qemu/device allocation-ripple divergence that broke A15.
  prompt: prompts/phase-A17-idiv-emitter-spill.md
  validator: validators/phase-A17-idiv-emitter-spill.sh
  max_turns: 500
  max_retries: 10
