# Phase plan for the OpenGOAL → Android port.
# Every phase runs claude-opus-4-7 at max effort (hardcoded in orchestrator.py).
# Retries are generous because stuck-detection (same-failure-3x-in-a-row)
# halts useless loops automatically. So we'd rather give it room to learn
# than artificially cap iterations.

phases:
  - id: "00-harness"
    name: "Differential test harness"
    prompt: prompts/phase-00-harness.md
    validator: validators/phase-00-harness.sh
    max_turns: 120
    max_retries: 10

  - id: "01-scaffold"
    name: "AArch64 emitter scaffold"
    prompt: prompts/phase-01-scaffold.md
    validator: validators/phase-01-scaffold.sh
    max_turns: 150
    max_retries: 10

  - id: "02-intarith"
    name: "Integer arithmetic codegen"
    prompt: prompts/phase-02-intarith.md
    validator: validators/phase-02-intarith.sh
    max_turns: 200
    max_retries: 12

  - id: "03-memops"
    name: "Memory load/store codegen"
    prompt: prompts/phase-03-memops.md
    validator: validators/phase-03-memops.sh
    max_turns: 200
    max_retries: 12

  - id: "04-controlflow"
    name: "Branches, labels, comparisons"
    prompt: prompts/phase-04-controlflow.md
    validator: validators/phase-04-controlflow.sh
    max_turns: 200
    max_retries: 12

  - id: "05-abi"
    name: "Function calls and AArch64 ABI"
    prompt: prompts/phase-05-abi.md
    validator: validators/phase-05-abi.sh
    max_turns: 300
    max_retries: 15

  - id: "06-float"
    name: "Scalar floating point"
    prompt: prompts/phase-06-float.md
    validator: validators/phase-06-float.sh
    max_turns: 200
    max_retries: 12

  - id: "07-neon"
    name: "SIMD: SSE/AVX -> NEON"
    prompt: prompts/phase-07-neon.md
    validator: validators/phase-07-neon.sh
    max_turns: 400
    max_retries: 15

  - id: "08-coroutines"
    name: "GOAL kernel context switch"
    prompt: prompts/phase-08-coroutines.md
    validator: validators/phase-08-coroutines.sh
    max_turns: 300
    max_retries: 15

  - id: "09-boot-linux-arm"
    name: "Boot Jak 1 under qemu-aarch64"
    prompt: prompts/phase-09-boot.md
    validator: validators/phase-09-boot.sh
    max_turns: 300
    max_retries: 20

  - id: "10-android-ndk"
    name: "Android NDK cross-build"
    prompt: prompts/phase-10-android.md
    validator: validators/phase-10-android.sh
    max_turns: 250
    max_retries: 10

  - id: "11-apk"
    name: "APK packaging and emulator boot"
    prompt: prompts/phase-11-apk.md
    validator: validators/phase-11-apk.sh
    max_turns: 250
    max_retries: 10

  # ---------- Strict phases added after auditing 10/11 scaffolding ----------
  # Phases 10/11 only proved the *shape* of the pipeline. The real porting
  # work (link the full runtime, produce a binary-manifest signed APK,
  # compile each game's GOAL source for the AArch64 backend) lives below.
  # Each of these validators is intentionally strict — a passing 12-16 is
  # what "the autoport actually finished" looks like.

  - id: "12-android-runtime"
    name: "Full OpenGOAL runtime cross-built into libgk.so"
    prompt: prompts/phase-12-android-runtime.md
    validator: validators/phase-12-android-runtime.sh
    max_turns: 600
    max_retries: 25

  - id: "13-real-apk"
    name: "Real APK (AGP, binary manifest, debug-signed)"
    prompt: prompts/phase-13-real-apk.md
    validator: validators/phase-13-real-apk.sh
    max_turns: 300
    max_retries: 15

  - id: "14-jak1"
    name: "Jak 1: goalc-arm64 compile + stage into APK assets"
    prompt: prompts/phase-14-jak1.md
    validator: validators/phase-14-jak1.sh
    max_turns: 400
    max_retries: 20

  - id: "15-jak2"
    name: "Jak 2: goalc-arm64 compile + stage into APK assets"
    prompt: prompts/phase-15-jak2.md
    validator: validators/phase-15-jak2.sh
    max_turns: 400
    max_retries: 20

  - id: "16-jak3"
    name: "Jak 3: goalc-arm64 compile + stage into APK assets"
    prompt: prompts/phase-16-jak3.md
    validator: validators/phase-16-jak3.sh
    max_turns: 400
    max_retries: 20

global:
  git:
    push_after_each_phase: true
    branch_prefix: "autoport/"
