name: MacOS Build

on:
  workflow_call:
    inputs:
      cmakePreset:
        required: true
        type: string
      cachePrefix:
        required: true
        type: string
      uploadArtifacts:
        required: false
        type: boolean
        default: false
      # Port CI (Grecharged-buildsys-cidocs): extra cmake defines (feature flags +
      # ogflags marker), optional target restriction, and a test toggle. Defaults
      # keep the upstream behavior byte-identical.
      cmakeArgs:
        required: false
        type: string
        default: ""
      buildTargets:
        required: false
        type: string
        default: ""
      runTests:
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: ARM
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Package Dependencies
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          if ! brew install ninja nasm; then
            brew update
            brew install ninja nasm
          fi

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          key: macos-15-${{ inputs.cachePrefix }}-${{ inputs.cmakePreset }}-${{ github.sha }}
          restore-keys: macos-15-${{ inputs.cachePrefix }}-${{ inputs.cmakePreset }}
          max-size: 1000M

      - name: CMake Generation
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build --preset=${{ inputs.cmakePreset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ${{ inputs.cmakeArgs }}

      - name: Build Project
        run: cmake --build build --parallel $((`sysctl -n hw.logicalcpu`)) ${{ inputs.buildTargets != '' && format('--target {0}', inputs.buildTargets) || '' }}

      - name: List libraries of gk
        run: otool -L ./build/game/gk

      - name: Binary smoke (run on macOS)
        if: ${{ inputs.uploadArtifacts }}
        run: ./build/goalc/goalc --version

      - name: Run Tests
        if: ${{ inputs.runTests }}
        run: ./test.sh

      - name: Prepare artifacts
        if: ${{ inputs.uploadArtifacts }}
        # tolerant: with a restricted buildTargets set, extractor/lsp may not exist
        run: |
          for f in goalc/goalc decompiler/extractor game/gk lsp/lsp; do
            [ -f "./build/$f" ] && strip "./build/$f" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ inputs.uploadArtifacts }}
        with:
          name: opengoal-macos-arm-${{ inputs.cachePrefix }}
          if-no-files-found: error
          path: |
            ./build/goalc/goalc
            ./build/decompiler/extractor
            ./build/game/gk
            ./build/lsp/lsp
